  :root {
    --burgundy: #610F3B;
    --burgundy-soft: #7D3D5E;
    --lilac: #E1C6FF;
    --lilac-soft: #F5EDFF;
    --cream: #F9EDEA;
    --cream-soft: #FCF6F4;
    --orange: #FF4924;
    --text: #1B1B1B;
    --muted: #6F6A6C;
    --line: #ECE6E8;
    --page: #F2F2F3;
    --thumb: #F2F1F3;
    --track: #EADDE2;
    --white: #FFFFFF;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --proto-h: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Jost Atomica', system-ui, sans-serif;
    color: var(--text);
    background: #E4E2E6;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    /* Jost stylistic set 1: single-storey "a", matching the SS01 setting on every atomica text style in Figma */
    font-feature-settings: "ss01" 1;
  }
  button, input { font-feature-settings: "ss01" 1; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  ul, ol { list-style: none; margin: 0; padding: 0; }
  h1, h2, h3, p { margin: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--burgundy); outline-offset: 2px; border-radius: 4px; }

  /* ---------- Prototype controls (not part of the design) ---------- */
  .proto {
    position: fixed; right: 16px; bottom: 16px; z-index: 100;
    display: flex; gap: 6px; align-items: center;

  // ---------- Helpers ----------
  const $ = s => document.querySelector(s);
  const cents = n => Math.round(n * 100) / 100;
  const money = n => '$' + cents(n).toFixed(2);
  const app = $('#app'), page = $('#page'), bar = $('#bar'), overlay = $('#overlay'), tray = $('#tray');
  const trayItems = $('#trayItems'), closeBtn = $('#trayClose');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  const state = { cart: '3', view: 'desktop', open: false, more: false };

  function totals(items) {
    let full = 0, disc = 0, count = 0;
    for (const p of items) {
      const base = p.was ?? p.price;
      full += base * p.qty; disc += (base - p.price) * p.qty; count += p.qty;
    }
    full = cents(full); disc = cents(disc);
    const net = cents(full - disc);
    return { full, disc, net, count, delivery: DELIVERY, total: cents(net + DELIVERY) };
  }

  function rowHTML(p, i) {
    const price = p.price === 0 ? 'Free' : money(p.price);
    const priceHTML = p.was
      ? `<span class="sale">${price}<span class="sr-only">, sale price, was ${money(p.was)}</span></span>`
      : `<span>${price}</span>`;
    return `<li class="row" style="--i:${i}">
      <span class="thumb">${p.img}</span>
      <span class="info">
        <span class="name ps" title="${p.name}">${p.name}</span>
        <span class="meta pm">${priceHTML}<span>Qty ${p.qty}</span></span>
      </span>
    </li>`;
  }

  function totalsHTML(t) {
    const label = `Subtotal (${t.count} ${t.count === 1 ? 'item' : 'items'})`;
    return `<div class="t-row"><span>${label}</span><span>${money(t.full)}</span></div>
      ${t.disc > 0 ? `<div class="t-row disc"><span>Discount</span><span>-${money(t.disc)}</span></div>` : ''}
      <div class="t-row"><span>Delivery</span><span>${t.delivery === 0 ? 'Free' : money(t.delivery)}</span></div>
      <div class="t-row total"><span>Total (inc GST)</span><span>${money(t.total)}</span></div>`;
  }

  function freeHTML(t) {
    const remaining = cents(FREE_THRESHOLD - t.net);
    const unlocked = remaining <= 0;
    const pct = unlocked ? 1 : Math.max(0, t.net / FREE_THRESHOLD);
    const msg = unlocked
      ? 'You could get free delivery!'
      : `Add <b>${money(remaining)}</b> more to unlock free delivery`;
    return `<div class="free-box">
      <p class="free-msg ps">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 5h10v9H2zM12 8h3.5L18 11v3h-6z"/><circle cx="5.5" cy="15" r="1.5" fill="#fff"/><circle cx="14.5" cy="15" r="1.5" fill="#fff"/></svg>
        <span>${msg}</span>
      </p>
      <div class="track" role="progressbar" aria-label="Progress to free delivery" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct * 100)}">
        <div class="fill" style="transform:scaleX(${pct})"></div>
      </div>
      <p class="free-sub pm">Members get free delivery on orders over $60</p>
    </div>`;
  }

  // ---------- Render ----------
  function render() {
    const items = CARTS[state.cart].map(i => PRODUCTS[i]);
    const t = totals(items);

    $('#orderTitle').textContent = `Your order (${t.count})`;

    // Mobile tray
    trayItems.innerHTML = items.map(rowHTML).join('');
    trayItems.scrollTop = 0;
    $('#trayTotals').innerHTML = totalsHTML(t);
    $('#trayFree').innerHTML = freeHTML(t);

    // Desktop card
    const first = items.slice(0, DESKTOP_VISIBLE), rest = items.slice(DESKTOP_VISIBLE);
    $('#deskFirst').innerHTML = first.map(rowHTML).join('');
    $('#deskRest').innerHTML = rest.map((p, i) => rowHTML(p, i)).join('');
    const moreBtn = $('#moreBtn');
    moreBtn.hidden = rest.length === 0;
    setMore(state.more && rest.length > 0, rest.length);
    $('#deskTotals').innerHTML = totalsHTML(t);

    // Bar
    $('#barTotal').textContent = money(t.total);
    $('#barSub').textContent = t.delivery === 0 ? 'Includes free delivery' : `Includes ${money(t.delivery)} delivery fee`;

    document.querySelectorAll('[data-cart]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cart === state.cart)));
  }

  function setMore(open, restCount) {
    state.more = open;
    const n = restCount ?? $('#deskRest').children.length;
    $('#deskMore').classList.toggle('open', open);
    $('#deskMore').inert = !open;
    $('#moreBtn').setAttribute('aria-expanded', String(open));
    $('#moreLabel').textContent = open ? 'Show less' : `Show ${n} more ${n === 1 ? 'product' : 'products'}`;
  }

  // ---------- View ----------
  function applyView() {
    const phone = window.innerWidth < 1024;
    document.body.classList.toggle('is-phone', phone);
    const view = phone ? 'mobile' : state.view;
    if (view === 'desktop' && state.open) close(true);
    app.dataset.view = view;
    document.querySelectorAll('[data-view]').forEach(b => { if (b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset.view === state.view)); });
  }

  // ---------- Tray ----------
  let lastFocus = null, justDragged = false;

  function open() {
    if (state.open || app.dataset.view !== 'mobile') return;
    state.open = true;
    lastFocus = document.activeElement;
    const rows = [...trayItems.children];
    if (!reduceMotion.matches) {
      rows.forEach((r, i) => { r.classList.add('pre'); r.style.transitionDelay = Math.min(i, 7) * 40 + 'ms'; });
    }
    tray.inert = false; page.inert = true; bar.inert = true;
    app.classList.add('is-open');
    bar.setAttribute('aria-expanded', 'true');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      rows.forEach(r => r.classList.remove('pre'));
      closeBtn.focus({ preventScroll: true });
    }));
    setTimeout(() => rows.forEach(r => (r.style.transitionDelay = '')), 700);
  }

  function close(instant) {
    if (!state.open) return;
    state.open = false;
    tray.style.transform = ''; tray.style.transition = '';
    overlay.style.opacity = ''; overlay.style.transition = '';
    app.classList.remove('is-open');
    tray.inert = true; page.inert = false; bar.inert = false;
    bar.setAttribute('aria-expanded', 'false');
    if (!instant) (lastFocus && lastFocus.isConnected && !page.contains(lastFocus) ? lastFocus : bar).focus({ preventScroll: true });
  }

  bar.addEventListener('click', open);
  overlay.addEventListener('click', () => close());
  closeBtn.addEventListener('click', () => { if (!justDragged) close(); });

  document.addEventListener('keydown', e => {
    if (!state.open) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key === 'Tab') {
      const f = [...tray.querySelectorAll('button, [tabindex="0"]')].filter(el => !el.hidden);
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // Drag to close: follows the finger, closes past 25% of height or on a fast downward flick
  let drag = null;
  tray.addEventListener('pointerdown', e => {
    if (!state.open || e.button !== 0 || e.target.closest('.items')) return;
    drag = { y0: e.clientY, id: e.pointerId, active: false, h: tray.offsetHeight, samples: [{ y: e.clientY, t: e.timeStamp }] };
  });
  tray.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y0;
    if (!drag.active) {
      if (Math.abs(dy) < 6) return;
      drag.active = true;
      tray.setPointerCapture(e.pointerId);
      tray.style.transition = 'none'; overlay.style.transition = 'none';
    }
    const y = dy > 0 ? dy : Math.max(dy * 0.2, -12); // light resistance upwards
    tray.style.transform = `translateY(${y}px)`;
    overlay.style.opacity = String(Math.max(0, 1 - Math.max(0, y) / drag.h));
    drag.samples.push({ y: e.clientY, t: e.timeStamp });
    while (drag.samples.length > 2 && e.timeStamp - drag.samples[0].t > 100) drag.samples.shift();
  });
  function endDrag(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.active) {
      const dy = e.clientY - drag.y0;
      const a = drag.samples[0], b = drag.samples[drag.samples.length - 1];
      const v = (b.y - a.y) / Math.max(1, b.t - a.t); // px per ms
      tray.style.transition = ''; overlay.style.transition = '';
      if (!cancelled && (dy > drag.h * 0.25 || v > 0.5)) close();
      else { tray.style.transform = ''; overlay.style.opacity = ''; }
      justDragged = true; setTimeout(() => (justDragged = false), 0);
    }
    drag = null;
  }
  tray.addEventListener('pointerup', e => endDrag(e, false));
  tray.addEventListener('pointercancel', e => endDrag(e, true));

  // ---------- Desktop show more ----------
  $('#moreBtn').addEventListener('click', () => setMore(!state.more));

  // ---------- Prototype controls ----------
  document.querySelectorAll('[data-cart]').forEach(b => b.addEventListener('click', () => {
    state.cart = b.dataset.cart; state.more = false; render();
  }));
  document.querySelectorAll('button[data-view]').forEach(b => b.addEventListener('click', () => {
    state.view = b.dataset.view; applyView();
  }));
  document.querySelectorAll('.pay-opt input, .check').forEach(el => el.addEventListener('click', e => e.stopPropagation()));
  document.querySelectorAll('a[href="#"]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
  window.addEventListener('resize', applyView);

  render();
  applyView();
})();
</script>
</body>
</html>
